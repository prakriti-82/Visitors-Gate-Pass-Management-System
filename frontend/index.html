<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visitor Gate Pass</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">
        <div class="nav-logo-icon">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        </div>
        GatePass
      </a>
      <ul class="nav-links">
        <li><a href="index.html" class="active">New Pass</a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="daily-report.html">Reports</a></li>
      </ul>
    </div>
  </nav>

  <!-- PAGE WRAPPER -->
  <div class="page-wrapper">
    <div class="form-shell">

      <!-- PAGE HEADER -->
      <div class="page-header">
        <img src="1000108236.png" alt="Company Logo" class="company-logo">
        <div>
          <p class="page-eyebrow">Visitor Management</p>
          <h1 class="page-title">Generate Gate Pass</h1>
          <p class="page-sub">Fill in visitor details to issue an entry pass.</p>
        </div>
      </div>

      <form id="visitorForm">

        <!-- SECTION 1: Visitor Details -->
        <div class="form-section">
          <div class="section-header">
            <span class="section-num">1</span>
            <span class="section-label">Visitor Details</span>
          </div>
          <div class="field-grid">
            <div class="field full">
              <label class="field-label" for="aadhar">Aadhaar Number</label>
              <div class="input-icon-wrap">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
                <input type="text" id="aadhar" class="field-input" placeholder="XXXX XXXX XXXX" required maxlength="14">
              </div>
            </div>
            <div class="field">
              <label class="field-label" for="name">Full Name</label>
              <input type="text" id="name" class="field-input" placeholder="Visitor name" required>
            </div>
            <div class="field">
              <label class="field-label" for="persons">Number of Persons</label>
              <input type="number" id="persons" class="field-input" placeholder="1" min="1" value="1">
            </div>
            <div class="field full">
              <label class="field-label" for="address">Address</label>
              <input type="text" id="address" class="field-input" placeholder="Full address" required>
            </div>
            <div class="field full">
              <label class="field-label" for="equipment">Equipment / Items Carried</label>
              <input type="text" id="equipment" class="field-input" placeholder="List any items being carried (optional)">
            </div>
          </div>
          <div id="personsContainer"></div>
        </div>

        <!-- SECTION 2: Visit Details -->
        <div class="form-section">
          <div class="section-header">
            <span class="section-num">2</span>
            <span class="section-label">Visit Details</span>
          </div>
          <div class="field-grid">
            <div class="field">
              <label class="field-label" for="generatedBy">Generated By</label>
              <div class="input-icon-wrap">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
                <input type="text" id="generatedBy" class="field-input" placeholder="Employee name" required>
              </div>
            </div>
            <div class="field">
              <label class="field-label" for="meetTo">Meeting With</label>
              <div class="input-icon-wrap">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                <input type="text" id="meetTo" class="field-input" placeholder="Person being met" required>
              </div>
            </div>
            <div class="field">
              <label class="field-label" for="date">Visit Date</label>
              <div class="input-icon-wrap">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/></svg>
                <input type="date" id="date" class="field-input" required>
              </div>
            </div>
            <div class="field">
              <label class="field-label" for="building">Building</label>
              <div class="input-icon-wrap">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="1"/><path d="M3 9h18M9 21V9"/></svg>
                <select id="building" class="field-input" required>
                  <option value="">Select building</option>
                  <option value="Admin">Admin</option>
                  <option value="Plant">Plant</option>
                </select>
              </div>
            </div>
            <div class="field">
              <label class="field-label" for="inTime">Entry Time</label>
              <div class="input-icon-wrap">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 15"/></svg>
                <input type="time" id="inTime" class="field-input" required>
              </div>
            </div>
            <div class="field">
              <label class="field-label" for="outTime">Exit Time</label>
              <div class="input-icon-wrap">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 15"/></svg>
                <input type="time" id="outTime" class="field-input" required>
              </div>
            </div>
          </div>
        </div>

        <!-- SECTION 3: Visitor Type -->
        <div class="form-section">
          <div class="section-header">
            <span class="section-num">3</span>
            <span class="section-label">Visitor Type</span>
          </div>
          <div class="type-toggle">
            <label class="type-option">
              <input type="radio" name="visitorTypeRadio" id="typeVisitor" value="new" checked>
              <span class="type-card">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
                Visitor
              </span>
            </label>
            <label class="type-option">
              <input type="radio" name="visitorTypeRadio" id="typeVendor" value="vendor">
              <span class="type-card">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="1" y="3" width="15" height="13"/><path d="M16 8h4l3 5v3h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
                Vendor
              </span>
            </label>
          </div>
          <!-- Hidden select kept for script.js compatibility -->
          <select id="visitorType" style="display:none;" required>
            <option value="new">Visitor</option>
            <option value="vendor">Vendor</option>
          </select>
        </div>

        <!-- SECTION 4: Visitor Photo -->
        <div class="form-section">
          <div class="section-header">
            <span class="section-num">4</span>
            <span class="section-label">Visitor Photo</span>
          </div>
          <div class="photo-zone" id="photoZone">
            <div class="photo-preview-wrap">
              <img id="photoPreview" alt="Visitor photo preview">
              <video id="camera" autoplay></video>
            </div>
            <div class="photo-zone-body">
              <div class="photo-zone-icon">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
              </div>
              <p class="photo-zone-text">Upload a photo or capture with camera</p>
              <div class="photo-zone-btns">
                <label for="visitorPhoto" class="btn-ghost">
                  <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                  Upload Photo
                </label>
                <input type="file" id="visitorPhoto" accept="image/*" capture="user" style="display:none;">
                <button type="button" id="startCamera" class="btn-ghost">
                  <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                  Open Camera
                </button>
                <button type="button" id="takePhoto" class="btn-ghost" style="display:none;">
                  <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg>
                  Capture
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- OPTIONAL EMAIL -->
        <div class="form-section optional-email-section">
          <div class="optional-email-row">
            <div class="optional-email-icon">
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            </div>
            <div class="optional-email-body">
              <label class="field-label" for="extraEmail">Send Copy To <span class="optional-tag">optional</span></label>
              <input type="text" id="extraEmail" class="field-input" placeholder="Email address of additional recipient">
            </div>
          </div>
        </div>

        <!-- FORM ACTIONS -->
        <div class="form-actions">
          <button type="button" id="reopenBtn" class="btn-secondary">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.5"/></svg>
            Reopen Today's Pass
          </button>
          <button type="submit" class="btn-primary">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><polyline points="9 15 11 17 15 13"/></svg>
            Generate Gate Pass
          </button>
        </div>
      </form>

      <!-- GATE PASS OUTPUT -->
      <div id="gatePass" style="display:none;">
        <div class="pass-header">
          <img src="1000108236.png" alt="Company Logo" class="logo">
          <h3>Visitor Gate Pass</h3>
        </div>
        <p id="passDetails"></p>
        <div class="pass-actions">
          <button type="button" onclick="window.print()" class="btn-primary">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
            Print Pass
          </button>
          <button type="button" id="sendMailBtn" class="btn-secondary">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            Send to Security
          </button>
          <button type="button" id="backBtn" class="btn-ghost-dark">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            Back
          </button>
        </div>
      </div>

    </div><!-- /form-shell -->
  </div><!-- /page-wrapper -->

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script>
    /* Sync radio buttons → hidden select for script.js compatibility */
    document.querySelectorAll('input[name="visitorTypeRadio"]').forEach(radio => {
      radio.addEventListener('change', () => {
        document.getElementById('visitorType').value = radio.value;
      });
    });
  </script>
  <script src="script.js"></script>
</body>
</html>
